name: CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('CI / approve {0}', inputs.commit_sha) || 'CI' }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to execute on the GitHub-hosted runner
        required: true
        type: string
      confirmation:
        description: Type RUN to approve this exact SHA
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: verify
    # push and pull_request run script/ci.sh on GitHub-hosted xcode-27 with no secrets.
    # workflow_dispatch re-runs one exact SHA and stays owner-gated.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.confirmation == 'RUN')
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TARGET_SHA: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha
          || github.event_name == 'pull_request' && github.event.pull_request.head.sha
          || github.sha }}

    steps:
      - name: Validate approved commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --silent

      # push/pull_request runs already get a native check tied to the right commit for free;
      # only the ad-hoc workflow_dispatch path (which can target a SHA that isn't a branch tip)
      # needs to post and complete its own check-run manually.
      - name: Create required check on approved SHA
        if: github.event_name == 'workflow_dispatch'
        id: required_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          check_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='CI / verify' \
            -f head_sha="$TARGET_SHA" \
            -f status='in_progress' \
            -f details_url="$details_url" \
            --jq .id)"
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      - name: Check out commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Run canonical CI
        run: script/ci.sh

      - name: Complete required check
        if: always() && github.event_name == 'workflow_dispatch' && steps.required_check.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          CHECK_ID: ${{ steps.required_check.outputs.check_id }}
        run: |
          case "$JOB_STATUS" in
            success) conclusion=success ;;
            cancelled) conclusion=cancelled ;;
            *) conclusion=failure ;;
          esac
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
