name: Upload TestFlight
run-name: TestFlight ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to upload
        required: true
        type: string
      confirmation:
        description: Type UPLOAD to approve this exact SHA
        required: true
        type: string

concurrency:
  group: testflight-upload
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ASC_APP_ID: "6780560937"
  ASC_TEAM_ID: "72UN4PF4BL"
  GCP_PROJECT_ID: general-secrets-store
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/320884539284/locations/global/workloadIdentityPools/github-actions/providers/pastebuddy
  GCP_SERVICE_ACCOUNT: pastebuddy-github-actions@general-secrets-store.iam.gserviceaccount.com
  ASC_API_KEY_SECRET: asc-api-key-664UJQLMB2
  IOS_PROJECT: PasteBuddyiOS.xcodeproj
  IOS_SCHEME: PasteBuddyiOS
  IOS_CONFIGURATION: Release

jobs:
  upload:
    name: Build and Upload
    if: github.actor == github.repository_owner && inputs.confirmation == 'UPLOAD'
    runs-on: [self-hosted, macOS, ARM64, pastebuddy-release, xcode-27]
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: read
      id-token: write
    outputs:
      build_number: ${{ steps.next_build.outputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove protected main source
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Clear stale temporary upload state
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/PasteBuddyiOS.xcarchive" "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/TestFlightExport" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_ID"
          mkdir -p "$RUNNER_TEMP/asc"
          gcloud secrets versions access latest \
            --secret="$ASC_API_KEY_SECRET" \
            --project="$GCP_PROJECT_ID" \
            --out-file="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve previous CI build number
        run: |
          git fetch --tags --force
          ruby -e 'numbers = `git tag --list "ios-build-*"`.lines.filter_map { |line| line[/\Aios-build-(\d+)\s*\z/, 1]&.to_i }; File.open(ENV.fetch("GITHUB_ENV"), "a") { |file| file.puts("CI_BUILD_NUMBER_FLOOR=#{numbers.max || 0}") }'

      - name: Resolve next App Store build number
        id: next_build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MIN_BUILD_NUMBER: ${{ env.CI_BUILD_NUMBER_FLOOR }}
        run: |
          build_number="$(ruby .github/scripts/next_app_store_build_number.rb)"
          echo "PB_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Using App Store build number $build_number"

      - name: Run Swift tests
        run: swift test

      - name: Archive iOS app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration "$IOS_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PasteBuddyiOS.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$PB_BUILD_NUMBER" \
            archive

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>upload</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${ASC_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PasteBuddyiOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean temporary upload inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/PasteBuddyiOS.xcarchive" "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/TestFlightExport" "$RUNNER_TEMP/ExportOptions.plist"

  persist-build-tag:
    name: Persist uploaded build tag
    needs: upload
    runs-on: [self-hosted, macOS, ARM64, pastebuddy-release, xcode-27]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PB_BUILD_NUMBER: ${{ needs.upload.outputs.build_number }}
      APPROVED_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Check out uploaded commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Persist uploaded build number
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="ios-build-$PB_BUILD_NUMBER"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally"
          else
            git tag "$tag"
          fi
          git push origin "refs/tags/$tag"
